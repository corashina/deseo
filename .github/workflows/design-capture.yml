name: Design capture

# Screenshots and impeccable detector results for every web screen and site page.
# Run it by hand for the impeccable review. Download the design-capture artifact.
on:
  workflow_dispatch:
  # Also run when this workflow changes, so a change is checked before merge.
  pull_request:
    paths: [.github/workflows/design-capture.yml]

jobs:
  capture:
    name: Capture screens
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: '1'
      SUPABASE_TELEMETRY_DISABLED: 'true'
    steps:
      # The local stack uses ports 55720 to 55729. Keep outgoing connections off them.
      - run: |
          sudo sysctl -w net.ipv4.ip_local_port_range="32768 49999"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="55720-55729"
      - uses: actions/checkout@v4
      # Install the CLI before npm ci, so Supabase starts while packages install.
      - id: versions
        run: echo "supabase=$(jq -r .devDependencies.supabase package.json)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.versions.outputs.supabase }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.16.0
      - name: Install packages and browser, start Supabase
        run: |
          supabase start --exclude studio,vector,logflare,imgproxy,supavisor > "$RUNNER_TEMP/supabase.log" 2>&1 &
          # Mobile packages triple the install time, and these jobs do not use them.
          npm ci --workspace @deseo/web --include-workspace-root
          npm exec --workspace @deseo/web -- playwright install --with-deps chromium
          wait $! || { cat "$RUNNER_TEMP/supabase.log"; exit 1; }
      - name: Serve Edge functions
        run: |
          nohup npm run functions > "$RUNNER_TEMP/functions.log" 2>&1 &
          timeout 120 bash -c "until grep -q 'Serving functions' '$RUNNER_TEMP/functions.log'; do sleep 1; done" || { cat "$RUNNER_TEMP/functions.log"; exit 1; }
      - name: Capture
        working-directory: apps/web
        run: |
          supabase status -o json > "$RUNNER_TEMP/status.json"
          export VITE_SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/status.json")
          export VITE_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY "$RUNNER_TEMP/status.json")
          CAPTURE=1 npx playwright test --trace off
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-capture
          path: .superpowers/design-capture
          include-hidden-files: true
          retention-days: 14
