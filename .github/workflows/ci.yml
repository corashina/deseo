name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    name: Mobile, web and domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test --workspace @deseo/mobile
      - run: npm run test --workspace @deseo/domain
      - run: npm run build --workspace @deseo/web

  backend:
    name: Database, races and functions
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: '1'
      SUPABASE_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npx supabase start --exclude studio,vector,logflare,imgproxy,supavisor
      - run: npx supabase test db --local
      - name: Check generated database types
        run: |
          npm run gen:types
          git diff --exit-code packages/domain/src/database.types.ts
      - run: node --experimental-strip-types --test supabase/tests/planning-races.test.ts
      - run: npm run typecheck:functions
      - run: npm run test:functions
