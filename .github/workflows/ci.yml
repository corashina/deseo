name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apps:
    name: Mobile, web and domain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test --workspace @deseo/mobile
      - run: npm run build --workspace @deseo/web
      - run: npm run size --workspace @deseo/web
      - run: npm run build --workspace @deseo/site
      # Design drift: impeccable checks colors, type, and spacing against DESIGN.md. See docs/DEVELOPMENT.md.
      - run: npx --yes impeccable@4.9.2 detect --github apps/web/src apps/site

  backend:
    name: Database, races and functions
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: '1'
      SUPABASE_TELEMETRY_DISABLED: 'true'
    steps:
      # The local stack uses ports 55720 to 55729. Keep outgoing connections off them.
      - run: |
          sudo sysctl -w net.ipv4.ip_local_port_range="32768 49999"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="55720-55729"
      - uses: actions/checkout@v4
      # Install the CLI before npm ci, so Supabase starts while packages install.
      - id: versions
        run: echo "supabase=$(jq -r .devDependencies.supabase package.json)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.versions.outputs.supabase }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.16.0
      - name: Install packages and start Supabase
        run: |
          supabase start --exclude studio,vector,logflare,imgproxy,supavisor > "$RUNNER_TEMP/supabase.log" 2>&1 &
          # Mobile packages triple the install time, and these jobs do not use them.
          npm ci --workspace @deseo/web --include-workspace-root
          wait $! || { cat "$RUNNER_TEMP/supabase.log"; exit 1; }
      - run: supabase test db --local
      - name: Check generated database types
        run: |
          npm run gen:types
          git diff --exit-code packages/domain/src/database.types.ts
      - run: node --experimental-strip-types --test --test-force-exit supabase/tests/planning-races.test.ts
      - run: npm run typecheck:functions
      - run: npm run test:functions

  web-e2e:
    name: Web journeys
    runs-on: ubuntu-latest
    env:
      DO_NOT_TRACK: '1'
      SUPABASE_TELEMETRY_DISABLED: 'true'
    steps:
      # The local stack uses ports 55720 to 55729. Keep outgoing connections off them.
      - run: |
          sudo sysctl -w net.ipv4.ip_local_port_range="32768 49999"
          sudo sysctl -w net.ipv4.ip_local_reserved_ports="55720-55729"
      - uses: actions/checkout@v4
      # Install the CLI before npm ci, so Supabase starts while packages install.
      - id: versions
        run: echo "supabase=$(jq -r .devDependencies.supabase package.json)" >> "$GITHUB_OUTPUT"
      - uses: supabase/setup-cli@v1
        with:
          version: ${{ steps.versions.outputs.supabase }}
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm install --global npm@11.16.0
      - name: Install packages and browser, start Supabase
        run: |
          sudo ss -tanp | grep -E ':5572[0-9]\b' || true
          supabase start --exclude studio,vector,logflare,imgproxy,supavisor > "$RUNNER_TEMP/supabase.log" 2>&1 &
          # Mobile packages triple the install time, and these jobs do not use them.
          npm ci --workspace @deseo/web --include-workspace-root
          npm exec --workspace @deseo/web -- playwright install --with-deps chromium
          wait $! || {
            cat "$RUNNER_TEMP/supabase.log"
            echo "Sockets on the local stack ports after the failure:"
            sudo ss -tanp | grep -E ':5572[0-9]\b' || true
            docker ps -a
            exit 1
          }
      - name: Serve Edge functions
        run: |
          nohup npm run functions > "$RUNNER_TEMP/functions.log" 2>&1 &
          timeout 120 bash -c "until grep -q 'Serving functions' '$RUNNER_TEMP/functions.log'; do sleep 1; done" || { cat "$RUNNER_TEMP/functions.log"; exit 1; }
      - name: Run browser tests
        run: |
          supabase status -o json > "$RUNNER_TEMP/status.json"
          export VITE_SUPABASE_URL=$(jq -r .API_URL "$RUNNER_TEMP/status.json")
          export VITE_SUPABASE_PUBLISHABLE_KEY=$(jq -r .PUBLISHABLE_KEY "$RUNNER_TEMP/status.json")
          npm run test --workspace @deseo/web
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-tests
          path: |
            .superpowers/web-tests
            ${{ runner.temp }}/functions.log
          include-hidden-files: true
          retention-days: 7
