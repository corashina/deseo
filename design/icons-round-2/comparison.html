<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deseo · Refined app icons</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px 40px;background:#FAF7F5;color:#383547;font:15px/1.5 system-ui,sans-serif}header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin:0 auto 26px;max-width:1280px}h1{font-size:30px;letter-spacing:-1px;margin:0}p{color:#6C6475;margin:4px 0 0}.eyebrow{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;margin-bottom:6px}.palette{display:flex;gap:7px}.palette i{width:24px;height:24px;border-radius:8px;display:block}.grid{max-width:1280px;margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px 24px}figure{margin:0;min-width:0}.large{display:block;width:100%;aspect-ratio:1;border-radius:24%;object-fit:contain;border:1px solid #E5DEE8}.caption{display:flex;align-items:center;gap:10px;margin-top:12px}.number{font-size:12px;background:#EAE4F5;border-radius:8px;padding:4px 7px;color:#60527C}h2{font-size:14px;font-weight:600;margin:0}.small{width:32px;height:32px;border-radius:24%;margin-left:auto;border:1px solid #E5DEE8}footer{max-width:1280px;margin:28px auto 0;padding-top:16px;border-top:1px solid #E5DEE8;display:flex;justify-content:space-between;font-size:12px;color:#6C6475}@media(max-width:800px){body{padding:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:start}h1{font-size:24px}.palette{display:none}footer{display:block}}
</style></head><body>
<header><div><p class="eyebrow">Deseo / Identity study · Round 02</p><h1>Closer, softer, together.</h1><p>Ten refinements of your favorites: 01, 10, and 05.</p></div><div class="palette" aria-label="Blush, mint, lavender, and peach palette"><i style="background:#E6B8C7"></i><i style="background:#B9DAD2"></i><i style="background:#CEC7E9"></i><i style="background:#F2D4BA"></i></div></header>
<main class="grid">
<figure><img class="large" src="icon-01-closer.png" alt="Closer pastel app icon"><figcaption class="caption"><span class="number">01</span><h2>Closer</h2><img class="small" src="icon-01-closer.png" alt="Closer at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-02-embrace.png" alt="Embrace pastel app icon"><figcaption class="caption"><span class="number">02</span><h2>Embrace</h2><img class="small" src="icon-02-embrace.png" alt="Embrace at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-03-heart-talk.png" alt="Heart talk pastel app icon"><figcaption class="caption"><span class="number">03</span><h2>Heart talk</h2><img class="small" src="icon-03-heart-talk.png" alt="Heart talk at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-04-shared-spark.png" alt="Shared spark pastel app icon"><figcaption class="caption"><span class="number">04</span><h2>Shared spark</h2><img class="small" src="icon-04-shared-spark.png" alt="Shared spark at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-05-two-voices.png" alt="Two voices pastel app icon"><figcaption class="caption"><span class="number">05</span><h2>Two voices</h2><img class="small" src="icon-05-two-voices.png" alt="Two voices at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-06-heart-petals.png" alt="Heart petals pastel app icon"><figcaption class="caption"><span class="number">06</span><h2>Heart petals</h2><img class="small" src="icon-06-heart-petals.png" alt="Heart petals at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-07-twin-stars.png" alt="Twin stars pastel app icon"><figcaption class="caption"><span class="number">07</span><h2>Twin stars</h2><img class="small" src="icon-07-twin-stars.png" alt="Twin stars at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-08-spark-talk.png" alt="Spark talk pastel app icon"><figcaption class="caption"><span class="number">08</span><h2>Spark talk</h2><img class="small" src="icon-08-spark-talk.png" alt="Spark talk at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-09-heart-orbit.png" alt="Heart orbit pastel app icon"><figcaption class="caption"><span class="number">09</span><h2>Heart orbit</h2><img class="small" src="icon-09-heart-orbit.png" alt="Heart orbit at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-10-spark-embrace.png" alt="Spark embrace pastel app icon"><figcaption class="caption"><span class="number">10</span><h2>Spark embrace</h2><img class="small" src="icon-10-spark-embrace.png" alt="Spark embrace at 32 pixels"></figcaption></figure>
</main><footer><span>Pastel colors · Heart, chat, and star shapes</span><span>Small previews show each icon at 32px.</span></footer>
</body></html>
