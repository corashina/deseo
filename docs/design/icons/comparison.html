<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deseo · 10 app icon concepts</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:32px 40px;background:#FAF7F5;color:#383547;font:15px/1.5 system-ui,sans-serif}header{display:flex;align-items:end;justify-content:space-between;gap:24px;margin:0 auto 26px;max-width:1280px}h1{font-size:30px;letter-spacing:-1px;margin:0}p{color:#6C6475;margin:4px 0 0}.eyebrow{font-size:12px;letter-spacing:1.3px;text-transform:uppercase;margin-bottom:6px}.palette{display:flex;gap:7px}.palette i{width:24px;height:24px;border-radius:8px;display:block}.grid{max-width:1280px;margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:20px 24px}figure{margin:0;min-width:0}.large{display:block;width:100%;aspect-ratio:1;border-radius:24%;object-fit:contain;border:1px solid #E5DEE8}.caption{display:flex;align-items:center;gap:10px;margin-top:12px}.number{font-size:12px;background:#EAE4F5;border-radius:8px;padding:4px 7px;color:#60527C}h2{font-size:14px;font-weight:600;margin:0}.small{width:32px;height:32px;border-radius:24%;margin-left:auto;border:1px solid #E5DEE8}footer{max-width:1280px;margin:28px auto 0;padding-top:16px;border-top:1px solid #E5DEE8;display:flex;justify-content:space-between;font-size:12px;color:#6C6475}@media(max-width:800px){body{padding:24px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}header{align-items:start}h1{font-size:24px}.palette{display:none}footer{display:block}}
</style></head><body>
<header><div><p class="eyebrow">Deseo / Identity study</p><h1>Ten ways to say “together”.</h1><p>App icon concepts · Choose a number from 01 to 10</p></div><div class="palette" aria-label="Blush, mint, lavender, and peach palette"><i style="background:#E6B8C7"></i><i style="background:#B9DAD2"></i><i style="background:#CEC7E9"></i><i style="background:#F2D4BA"></i></div></header>
<main class="grid">
<figure><img class="large" src="icon-01-together.png" alt="Blush and mint petals with a heart gap"><figcaption class="caption"><span class="number">01</span><h2>Together</h2><img class="small" src="icon-01-together.png" alt="Together at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-02-linked.png" alt="Two interlocking pastel rings"><figcaption class="caption"><span class="number">02</span><h2>Linked</h2><img class="small" src="icon-02-linked.png" alt="Linked at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-03-folded-heart.png" alt="A heart made from blush and lavender ribbons"><figcaption class="caption"><span class="number">03</span><h2>Folded heart</h2><img class="small" src="icon-03-folded-heart.png" alt="Folded heart at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-04-our-place.png" alt="Two figures inside a pastel home"><figcaption class="caption"><span class="number">04</span><h2>Our place</h2><img class="small" src="icon-04-our-place.png" alt="Our place at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-05-conversation.png" alt="Two speech bubbles with a heart gap"><figcaption class="caption"><span class="number">05</span><h2>Conversation</h2><img class="small" src="icon-05-conversation.png" alt="Conversation at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-06-our-date.png" alt="A calendar with a blush heart"><figcaption class="caption"><span class="number">06</span><h2>Our date</h2><img class="small" src="icon-06-our-date.png" alt="Our date at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-07-deseo.png" alt="A rounded lavender d with a blush center"><figcaption class="caption"><span class="number">07</span><h2>Deseo</h2><img class="small" src="icon-07-deseo.png" alt="Deseo at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-08-lovebirds.png" alt="Two pastel birds facing each other"><figcaption class="caption"><span class="number">08</span><h2>Lovebirds</h2><img class="small" src="icon-08-lovebirds.png" alt="Lovebirds at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-09-shared-path.png" alt="A blush and mint woven knot"><figcaption class="caption"><span class="number">09</span><h2>Shared path</h2><img class="small" src="icon-09-shared-path.png" alt="Shared path at 32 pixels"></figcaption></figure>
<figure><img class="large" src="icon-10-two-sparks.png" alt="Lavender and peach rounded stars"><figcaption class="caption"><span class="number">10</span><h2>Two sparks</h2><img class="small" src="icon-10-two-sparks.png" alt="Two sparks at 32 pixels"></figcaption></figure>
</main><footer><span>Pastel colors · Rounded shapes · Original concept images</span><span>Small previews show each icon at 32px.</span></footer>
</body></html>
